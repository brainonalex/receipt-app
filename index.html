<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이수 영수증 비서</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f1f3f4; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .hidden { display: none; }
        #preview { width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
        .status { text-align: center; font-size: 14px; color: #d93025; font-weight: bold; padding: 10px; }
    </style>
</head>
<body>

    <div id="setup-screen" class="card hidden">
        <h2>⚙️ 초기 설정</h2>
        <input type="text" id="userName" placeholder="이름 (시트 탭 이름과 동일하게)">
        <input type="text" id="folderId" placeholder="구글 드라이브 폴더 ID">
        <input type="text" id="sheetId" placeholder="스프레드시트 ID">
        <input type="email" id="userEmail" placeholder="백업 이메일 주소">
        <button onclick="saveSettings()">설정 저장</button>
    </div>

    <div id="main-screen" class="card">
        <h2 id="welcome-msg">영수증 촬영</h2>
        <input type="file" id="camera" accept="image/*" capture="environment" class="hidden" onchange="handleFile(this)">
        <button onclick="document.getElementById('camera').click()">📸 영수증 사진 찍기</button>
        <input type="file" id="gallery" accept="image/*" class="hidden" onchange="handleFile(this)">
        <button onclick="document.getElementById('gallery').click()" style="background:#5f6368;">🖼️ 앨범에서 고르기</button>
        
        <img id="preview">
        <div id="status-msg" class="status hidden"></div>

        <div id="result-area" class="hidden">
            <h3 style="font-size:14px; color:#555;">데이터 확인 (수정 가능)</h3>
            <input type="date" id="r-date">
            <input type="text" id="r-store" placeholder="상호명">
            <input type="number" id="r-amount" placeholder="금액">
            <select id="r-currency">
                <option value="JPY">JPY (엔)</option>
                <option value="KRW">KRW (원)</option>
            </select>
            <button id="send-btn" onclick="sendData()" style="background:#1e8e3e;">🚀 전송하기</button>
        </div>
        <button onclick="showSetup()" style="background:none; color:#666; font-size:13px; text-decoration:underline; border:none; margin-top:20px;">설정 다시하기</button>
    </div>

    <script>
        // ★ 본인의 웹 앱 URL을 여기에 꼭 넣어주세요!
        var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwNQN9IGHd7yfaG3NK94pcuzcQG7h6eCT2N2OewSVTD7QC0lLEuFF7oFJmIO2PgcE3lIw/exec";

        window.onload = function() { checkSetup(); };
        function checkSetup() {
            if (!localStorage.getItem('userName')) {
                document.getElementById('main-screen').classList.add('hidden');
                document.getElementById('setup-screen').classList.remove('hidden');
            } else {
                document.getElementById('welcome-msg').innerText = localStorage.getItem('userName') + "님의 영수증 정리";
            }
        }
        function saveSettings() {
            localStorage.setItem('userName', document.getElementById('userName').value);
            localStorage.setItem('folderId', document.getElementById('folderId').value);
            localStorage.setItem('sheetId', document.getElementById('sheetId').value);
            localStorage.setItem('userEmail', document.getElementById('userEmail').value);
            location.reload();
        }
        function showSetup() { localStorage.clear(); location.reload(); }

        let currentImageBase64 = "";

        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;
            const status = document.getElementById('status-msg');
            status.innerText = "🔍 AI 분석 중 (5~10초 소요)...";
            status.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 1000;
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    currentImageBase64 = dataUrl.split(',')[1];
                    document.getElementById('preview').src = dataUrl;
                    document.getElementById('preview').style.display = 'block';
                    runOCR(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function runOCR(imageData) {
            try {
                const result = await Tesseract.recognize(imageData, 'jpn+kor');
                let text = result.data.text;
                // 원문자 보정
                const circleMap = { '⓪':'0','①':'1','②':'2','③':'3','④':'4','⑤':'5','⑥':'6','⑦':'7','⑧':'8','⑨':'9','⑳':'20' };
                text = text.replace(/[⓪-⑨⑳]/g, m => circleMap[m] || m);

                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 1);
                let amount = (text.match(/[¥￥]\s*([0-9,]{2,})/) || text.match(/(?:合計|計|합계)\s*[:：]?\s*([0-9,]{2,})/i) || ["","0"])[1].replace(/[^0-9]/g, '');
                
                document.getElementById('r-store').value = lines[0] || "";
                document.getElementById('r-amount').value = amount;
                document.getElementById('r-date').value = new Date().toISOString().split('T')[0];
                document.getElementById('status-msg').innerText = "✅ 분석 완료! 내용을 확인하세요.";
                document.getElementById('result-area').classList.remove('hidden');
            } catch (err) {
                document.getElementById('status-msg').innerText = "⚠️ 인식 실패. 직접 입력해 주세요.";
                document.getElementById('result-area').classList.remove('hidden');
            }
        }

        function sendData() {
            const btn = document.getElementById('send-btn');
            btn.disabled = true; btn.innerText = "전송 중...";
            const payload = {
                userName: localStorage.getItem('userName'),
                folderId: localStorage.getItem('folderId'),
                sheetId: localStorage.getItem('sheetId'),
                userEmail: localStorage.getItem('userEmail'),
                imageByte: currentImageBase64,
                receipt: {
                    date: document.getElementById('r-date').value.replace(/-/g, ''),
                    store: document.getElementById('r-store').value || "상호미상",
                    amount: document.getElementById('r-amount').value || "0",
                    currency: document.getElementById('r-currency').value
                }
            };
            fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(r => r.json())
            .then(d => { if(d.result=="success") { alert("전송 성공!"); location.reload(); } else { throw d.message; }})
            .catch(e => { alert("오류: " + e); btn.disabled = false; btn.innerText = "다시 시도"; });
        }
    </script>
</body>
</html>
