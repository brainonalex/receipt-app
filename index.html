<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>이수 영수증 비서</title>
    <meta name="apple-mobile-web-app-title" content="이수영수증">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.2rem; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px;}
        button:active { transform: scale(0.98); opacity: 0.9; }
        .hidden { display: none; }
        #preview { width: 100%; border-radius: 10px; margin-top: 10px; display: none; border: 1px solid #eee; }
        .info-msg { text-align: center; color: #d93025; font-weight: bold; padding: 15px; background:#fce8e6; border-radius:8px; margin-top:10px; font-size: 14px;}
        .setup-btn { background: #6c757d; font-size: 14px; padding: 10px; }
    </style>
</head>
<body>

    <div id="setup-screen" class="card hidden">
        <h2>⚙️ 앱 초기 설정</h2>
        <p style="font-size: 13px; color: #666;">처음 한 번만 설정하면 됩니다.</p>
        <input type="text" id="userName" placeholder="본인 이름 (예: 손근형)">
        <input type="text" id="folderId" placeholder="구글 드라이브 폴더 ID">
        <input type="text" id="sheetId" placeholder="스프레드시트 ID">
        <input type="email" id="userEmail" placeholder="백업받을 이메일 주소">
        <button onclick="saveSettings()">설정 저장하기</button>
    </div>

    <div id="main-screen" class="card">
        <h2 id="welcome-msg">영수증 촬영</h2>
        
        <input type="file" id="camera" accept="image/*" capture="environment" class="hidden" onchange="handleFile(this)">
        <button onclick="document.getElementById('camera').click()">📸 영수증 사진 찍기</button>
        
        <input type="file" id="gallery" accept="image/*" class="hidden" onchange="handleFile(this)">
        <button onclick="document.getElementById('gallery').click()" style="background: #495057;">🖼️ 앨범에서 사진 고르기</button>
        
        <img id="preview">
        <div id="ocr-loading" class="info-msg hidden">🔍 AI가 내용을 분석 중입니다...<br>(약 5~10초 소요)</div>
        
        <div id="result-area" class="hidden">
            <h3 style="margin-top:20px; font-size:15px;">추출된 내용 확인 (수정 가능)</h3>
            <input type="date" id="r-date">
            <input type="text" id="r-store" placeholder="상호명">
            <input type="number" id="r-amount" placeholder="금액 (숫자만)">
            <select id="r-currency">
                <option value="JPY">JPY (엔)</option>
                <option value="KRW">KRW (원)</option>
                <option value="USD">USD (달러)</option>
            </select>
            <button id="send-btn" onclick="sendData()" style="background: #28a745;">🚀 시트 및 메일로 전송하기</button>
        </div>
        <button class="setup-btn" onclick="showSetup()">⚙️ 설정 수정</button>
    </div>

    <div id="loading" class="info-msg hidden" style="background:#e8f0fe; color:#1a73e8;">저장 및 이메일 전송 중...</div>

    <script>
        // ★ 본인의 웹 앱 URL 반영 완료
        var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNhxSUIu0oH3Uum1FoWuD_FxedTaDlGlZ8HJWTlAoSFpodOf8MMTLTrcepyMN5YH1jZg/exec";

        window.onload = function() { checkSetup(); };

        function checkSetup() {
            const name = localStorage.getItem('userName');
            if (!name) {
                document.getElementById('main-screen').classList.add('hidden');
                document.getElementById('setup-screen').classList.remove('hidden');
            } else {
                document.getElementById('welcome-msg').innerText = name + "님의 영수증 정리";
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
            }
        }

        function showSetup() {
            document.getElementById('userName').value = localStorage.getItem('userName') || "";
            document.getElementById('folderId').value = localStorage.getItem('folderId') || "";
            document.getElementById('sheetId').value = localStorage.getItem('sheetId') || "";
            document.getElementById('userEmail').value = localStorage.getItem('userEmail') || "";
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        function saveSettings() {
            localStorage.setItem('userName', document.getElementById('userName').value);
            localStorage.setItem('folderId', document.getElementById('folderId').value);
            localStorage.setItem('sheetId', document.getElementById('sheetId').value);
            localStorage.setItem('userEmail', document.getElementById('userEmail').value);
            alert('설정이 저장되었습니다!');
            checkSetup();
        }

        let currentImageBase64 = "";

        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            document.getElementById('result-area').classList.add('hidden');
            const ocrLoading = document.getElementById('ocr-loading');
            ocrLoading.classList.remove('hidden');
            ocrLoading.innerText = "🔍 AI가 분석 중입니다... (잠시만 기다려주세요)";

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000; // 해상도 살짝 상향
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    currentImageBase64 = dataUrl.split(',')[1];

                    const preview = document.getElementById('preview');
                    preview.src = dataUrl;
                    preview.style.display = 'block';

                    runOCR(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function runOCR(imageData) {
            try {
                // 일본어와 한국어에 집중하여 인식률 향상
                const result = await Tesseract.recognize(imageData, 'jpn+kor');
                let text = result.data.text;
                
                // 폰트 문제로 인한 원문자(②, ⑥ 등)를 일반 숫자로 강제 변환
                const circleToNum = { '⓪':'0','①':'1','②':'2','③':'3','④':'4','⑤':'5','⑥':'6','⑦':'7','⑧':'8','⑨':'9', '⑩':'10', '⑳':'20' };
                text = text.replace(/[⓪-⑨①-⑳]/g, m => circleToNum[m] || m);

                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 1);
                
                let store = "";
                let amount = "";
                let date = new Date().toISOString().split('T')[0];

                // 상호명 추출 로직: 유효한 첫 줄 찾기
                for (let i = 0; i < lines.length; i++) {
                    if (!lines[i].match(/(202[0-9]|領収|No|TEL|時刻|レ지|客|様|금액|합계)/i)) {
                        store = lines[i];
                        break;
                    }
                }

                // 금액 추출 로직: 기호나 합계 한자 주변 숫자 찾기
                const amountMatch = text.match(/[¥￥]\s*([0-9OIl\s,]{2,})/i) || text.match(/(?:合計|計|합계|Total)\s*[:：]?\s*([0-9OIl\s,]{2,})/i);
                if (amountMatch) {
                    amount = amountMatch[1].replace(/[O]/ig, '0').replace(/[Il]/g, '1').replace(/[^0-9]/g, '');
                }

                // 날짜 추출 로직
                const dateMatch = text.match(/(202[0-9])[年/.\-]\s*([0-1]?[0-9])[月/.\-]\s*([0-3]?[0-9])/);
                if (dateMatch) {
                    date = `${dateMatch[1]}-${dateMatch[2].padStart(2, '0')}-${dateMatch[3].padStart(2, '0')}`;
                }

                document.getElementById('r-store').value = store.substring(0, 20);
                document.getElementById('r-amount').value = amount;
                document.getElementById('r-date').value = date;

                document.getElementById('ocr-loading').innerText = "✅ 분석 완료! 확인 후 전송해 주세요.";
                document.getElementById('result-area').classList.remove('hidden');

            } catch (error) {
                document.getElementById('ocr-loading').innerText = "⚠️ 인식 실패. 직접 입력 부탁드립니다.";
                document.getElementById('result-area').classList.remove('hidden');
            }
        }

        function sendData() {
            const btn = document.getElementById('send-btn');
            const loading = document.getElementById('loading');
            btn.disabled = true;
            loading.classList.remove('hidden');

            const payload = {
                userName: localStorage.getItem('userName'),
                folderId: localStorage.getItem('folderId'),
                sheetId: localStorage.getItem('sheetId'),
                userEmail: localStorage.getItem('userEmail'),
                imageByte: currentImageBase64,
                receipt: {
                    date: document.getElementById('r-date').value.replace(/-/g, ''),
                    store: document.getElementById('r-store').value || "상호미상",
                    amount: document.getElementById('r-amount').value || "0",
                    currency: document.getElementById('r-currency').value
                }
            };

            fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => {
                alert('전송 완료! 시트와 이메일을 확인하세요.');
                location.reload();
            })
            .catch(err => {
                alert('전송 오류: ' + err);
                btn.disabled = false;
                loading.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
